[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["todo"]

[project]
name = "todo"
version = "0.1.0"
description = ""
authors = [{ name = "Kurtis Fields", email = "kurtisfields@gmail.com" }]
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "loguru >=0.7.3",
    "protobuf >=7.36.2"
]

[tool.attacus]
flutter_assets = "todo/flutter_assets"

[tool.hatch.envs.default]
python = "3.12"
installer = "uv"
workspace.members = [
  # Build toolchain
  "../../../cxbuild",

  # Attacus package
  "../../attacus",
]
dependencies = ["uv", "pytest", "mypy"]

