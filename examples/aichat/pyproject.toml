[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aichat"]

[project]
name = "aichat"
version = "0.1.0"
description = ""
authors = [{ name = "Kurtis Fields", email = "kurtisfields@gmail.com" }]
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "loguru >=0.7.3",
    "google-generativeai ==0.2.2",
    "python-dotenv ==1.0.0",
    "langchain ==0.0.348",
    "openai ==1.3.8"
]

[tool.setuptools]
packages=["aichat"]

[tool.attacus]
flutter_assets = "aichat/flutter_assets"

[tool.hatch.envs.default]
python = "3.12"
installer = "uv"
workspace.members = [
  # Build toolchain
  "../../../cxbuild",

  # Attacus package
  "../../attacus",
]
dependencies = ["uv", "pytest", "mypy"]

