[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["methodchannel"]

[project]
name = "methodchannel"
version = "0.1.0"
description = "My minimal Python project"
authors = [
    { name = "Your Name", email = "your.email@example.com" },
]

[tool.attacus]

[tool.hatch.envs.default]
python = "3.12"
installer = "uv"
workspace.members = [
  # Build toolchain
  "../../../cxbuild",

  # Attacus package
  "../../attacus",
]
dependencies = ["uv", "pytest", "mypy"]
